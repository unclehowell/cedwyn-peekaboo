name: sync-central
# This webapp's own data store. data/peekaboo.json holds only what the Peekaboo page shows: the records tagged "peekaboo"
# in the central catalogue (unclehowell/cedwyn data/core/records, main) or listed in tools/picks.json, with the fields the
# cards use. tools/peekaboo_sync.py pulls it read-only and runs the word gate. While the branch core/peekaboo-records
# exists (records not yet merged to main, unclehowell/cedwyn#141) it is read as an overlay on main, so no entry drops out.
# Derived: never edited by hand. Every 6 hours and on demand; commits only when the counts, entries or skipped list
# changed (a new sync time alone is not a change); never force-pushes.
# RENDER_HTML: while the page edit freeze is on, the server-rendered cards in index.html are left as they are and only the
# store is committed; set it to 'yes' when the freeze lifts. - Sion's Tab agent
on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-central
  cancel-in-progress: false
env:
  RENDER_HTML: 'no'
  OVERLAY: core/peekaboo-records
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Pull the fields this webapp needs from the central catalogue
        run: |
          cp data/peekaboo.json /tmp/before.json
          REFS="--ref main"
          if git ls-remote --exit-code --heads https://github.com/unclehowell/cedwyn.git "$OVERLAY" >/dev/null 2>&1; then REFS="$REFS --ref $OVERLAY"; fi
          echo "reading: $REFS"
          python3 tools/peekaboo_sync.py $REFS
      - name: Commit when something changed
        run: |
          CHANGED=$(python3 -c "import json; a=json.load(open('/tmp/before.json')); b=json.load(open('data/peekaboo.json')); k=lambda j:(j.get('counts'),j.get('entries'),j.get('skipped')); print('yes' if k(a)!=k(b) else 'no')")
          if [ "$CHANGED" != "yes" ]; then git checkout -- data/peekaboo.json index.html; echo "no change"; exit 0; fi
          git add data/peekaboo.json
          if [ "$RENDER_HTML" = "yes" ]; then git add index.html; else git checkout -- index.html; fi
          git -c user.name="cedwyn-central-sync" -c user.email="actions@users.noreply.github.com" commit -q -m "data/peekaboo.json: sync from the central catalogue"
          git push origin HEAD:main
